[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "noor-gaming-lab-backend"
version = "0.1.0"
description = "Noor Gaming Lab Backend API"
authors = ["Noor Gaming Lab Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111"
uvicorn = { extras = ["standard"], version = "^0.29" }
supabase = "^2.3"
python-jose = { extras = ["cryptography"], version = "^3.3" }
asyncpg = "^0.29"
pydantic = "^2.7"
python-dateutil = "^2.9"
apscheduler = "^3.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
ruff = "^0.3"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"] 